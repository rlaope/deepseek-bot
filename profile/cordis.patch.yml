# ─────────────────────────────────────────────────────────────────────────────
# deepbot profile patch — the agent's brain.
#
# Layer order (see profile/package.json):
#   dsh-base                        sessions, tools, skills, storage, goals, sandbox
#   dsh-web-app                     the host surface: HTTP server, session controller
#   dsh-experimental-schedule-bundle  durable reminders + time context
#   deepbot                 the Slack platform adapter (this repo)
#
# This file is the user patch layer: it is applied after every bundle, so the
# last write wins per row, and `config` is REPLACED wholesale (there is no deep
# merge). Copy it to `$DSH_HOME/profiles/<name>/cordis.patch.yml`.
# ─────────────────────────────────────────────────────────────────────────────

# ── Model route ──────────────────────────────────────────────────────────────
# dsh-base already defaults `agent-default-model` to the official DeepSeek route
# ("deepseek-official"), which reads DEEPSEEK_API_KEY from the credentials
# service. That is the simplest setup, so nothing is overridden here.
#
# install.sh appends the route below, filled in, when you choose OpenGateway or a
# custom OpenAI-compatible endpoint (see docs/setup.md, The model provider). By
# hand: uncomment it, point it at your endpoint, and keep the `agent-default-model`
# override naming the same provider id.
#
# - id: llm-pi-ai
#   config:
#     providers:
#       gateway:
#         displayName: My Gateway
#         apiKeyEnv: GATEWAY_API_KEY        # resolved through ctx.credentials
#         api: openai-completions
#         baseURL: https://your-gateway.example/v1
#         models:
#           - id: vendor/model-name
#             name: My Model
#             contextWindow: 200000
#             # Declare image input if the route supports it, or an attached picture
#             # reaches the model as a filename. The resolver reads `input`; a key named
#             # inputModalities is accepted by the schema and silently ignored.
#             input: [text, image]
#             # Only for a model that takes them. A reasoningEffort the model does not declare is
#             # refused by the harness; the plugin then sends none (and logs it).
#             reasoningEfforts:
#               low: low
#               medium: medium
#               high: high
#
# - id: agent-default-model
#   config:
#     provider: gateway
#     model: vendor/model-name
#     reasoningEffort: medium

# ── Memory switch: cross-session search ──────────────────────────────────────
# dsh-base ships this row as `path: ':memory:'` with `openAt: never`, i.e.
# full-text search over past sessions is OFF. This is the single change that
# turns the session log into something the agent can actually remember with.
#
# The index is a derived database, separate from the session log itself. It has
# exactly one owning process per path, so do not point two running gateways at
# the same file.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-index.db')
    openAt: startup
    journalMode: wal
    defaultLimit: 20
    maxLimit: 100

# ── Memory: declarative instructions ─────────────────────────────────────────
# AGENTS.md is read from the session working directory and its ancestors. Point
# the gateway at a home directory and put the agent's identity there (see
# agent/AGENTS.md in this repo).
- id: agent-instructions
  config:
    maxBytes: 131072

# ── Memory: procedural (skills) ──────────────────────────────────────────────
# Nothing to configure: the filesystem skill provider already scans, in rank
# order, <project>/.dsh/skills, <project>/.agents/skills, $DSH_HOME/skills and
# ~/.agents/skills, and watches them for changes. Drop a SKILL.md (or a flat
# <name>.md) into one of those and the agent can load it by name.
#
# Add extra roots with:
# - id: skill-filesystem
#   config:
#     customSkillDirs:
#       - /absolute/path/to/skills
#     includeDefaultRoots: true
#     watch: true

# ── Document authoring (optional, recommended for document work) ─────────────
# dsh-skill-office is a plain package, so no shipped bundle mounts it. This row
# puts office-docx / office-pptx / office-xlsx into the session skill catalog and
# appends the absolute LibreOffice Kit paths to each loaded skill body.
#
# dsh-tool-workspace-dependencies tells the agent where the bundled Python lives.
# The office provider ships instructions only; it does not install the authoring
# libraries, so without this the skill is present and unusable.
- insert:
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        # Electron-packaged runtimes throw in this provider unless a standalone
        # Node executable is named: (isSea() || process.versions.electron) is true
        # here. Without it the row fails to activate and the bot silently loses
        # the document workflows, the structural checks, and the LibreOffice paths.
        # On Windows the harness is an npm install run by a standalone node, which is that executable.
        # Quoted: unquoted, the ternary's " : " made YAML read the value as a mapping.
        node: !!js "process.env.DEEPBOT_NODE ?? (process.platform === 'win32' ? process.execPath : dshHomePath('dsh-runtimes/dsh-primary-runtime/dependencies/node/bin/node'))"

    - id: tool-workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      config:
        # Required, and required to be non-empty: an absolute payload directory
        # holding runtime.json and dependencies/. Without it the row fails
        # validation at boot, which is how this was found.
        source: !!js process.env.DSH_PRIMARY_RUNTIME ?? '/Applications/DeepSeek Harness.app/Contents/Resources/runtime/primary-runtime'

    # ── MCP servers (optional) ─────────────────────────────────────────────────
    # The harness's own MCP client puts a server's tools in front of the model as
    # mcp__<serverName>__<tool>. One row per server, in this insert list. Under
    # launchd PATH is /usr/bin:/bin:/usr/sbin:/sbin: name the program by absolute
    # path. Credentials go in ~/.dsh/.env and are handed over by name; never in the
    # agent home. A server is trusted code: it is not under the sandbox runner, it
    # can read the bot's own credential files, and none of the adapter's gates
    # (approval, read scope, fetch allowlist) applies to its tools.
    # docs/setup.md, MCP servers, has the rest.
    #
    # - id: mcp-example
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: example
    #     transport: stdio
    #     command: /absolute/path/to/server
    #     args: ['--some-flag']
    #     env:
    #       PATH: /opt/homebrew/bin:/usr/bin:/bin
    #       SERVICE_TOKEN: !!js process.env.EXAMPLE_TOKEN ?? ''

# ── 무인 운영용 권한 프리셋 ──────────────────────────────────────
# 기본값은 workspace-write 모드에서 approval=ask 다. 이 배포에는 승인을 물어볼
# 사람이 없다. 라이브에서 관측한 결과가 hang 이었다: 샌드박스가 문제를 겪자
# 에이전트가 danger-full-access 상향을 요청했고(approval/asked), 답변자가 없어
# 그 턴이 영원히 대기했다.
#
# sandbox 와 approval 을 따로 바꾸면 dsh-permission-presets 가 "조합에 맞는
# 프리셋이 없다"며 활성화를 거부하고, inject 하는 플러그인까지 연쇄로 pending 이
# 된다(실측). 그래서 조합을 프리셋으로 정의하고 기본값으로 지정한다.
# 샌드박스는 그대로 유지되고, 상향 요청은 결정적으로 거부된다 — 대기 대신 거부를
# 받은 모델이 다르게 시도하거나 불가능하다고 말한다.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      unattended:
        sandbox: workspace-write
        approval: never
    defaultPreset: unattended

# ── Instruction files ────────────────────────────────────────
# Nothing to configure. The harness's instruction loader sends AGENTS.md; the adapter itself sends
# SOUL.md, USER.md and MEMORY.md once per conversation. The loader that runs is mounted inside the
# `standard` agent preset with its default candidates — a top-level `agent-instructions` row with
# `instructionFileCandidates` is the disabled instance and changes nothing, which once hid a persona
# that never reached the model.

# ── Sandbox runner ───────────────────────────────────────────
# Commands run under service/confined-runner.sh: writes fenced to the agent's home, no reads of other
# agent homes or of the harness home (all but its runtimes), no ssh-agent.
# install-service.sh copies it next to the launcher; this points at that copy, so an edit in the
# repository does not reach the live agent until the next install.
- id: sandbox
  config:
    runnerCommand:
      - !!js dshHomePath('service/confined-runner.sh')
    runnerFailureSignatures: ['confined-runner:']

# ── Headless approvals ───────────────────────────────────────
# api-remotes registers an approval forwarder for every open client stream. With no browser attached
# it holds the request, and the adapter's own answerer never gets its turn. A headless gateway turns
# it off; the web surface stays up for the health check.
- id: api-remotes
  disabled: true

# ── The deepbot row ──────────────────────────────────────────
# `config` replaces the bundle's whole config, so every setting is restated here. install.sh sets the
# terminal alone; `dsh gateway setup` puts a messenger, its channels and its people here.
#   targetChannels: ['*'] answers in every channel the bot is invited to; a list of ids narrows it.
#   replyMode: mention answers @-mentions in channels; DMs are always answered. thread also takes every
#   message in a thread the bot takes part in, and the model keeps quiet when one is not for it.
#   language: what the bot itself says (approvals, stops, failures): en, ko or zh. The terminal's own
#   interface is English; the model's own answers follow the persona in SOUL.md, not this.
#   askTools (not set here: none): tools asked for on every call, as a destructive command is, such as an MCP
#   server's that sends mail or changes a calendar; an entry ending in * names the tools that start with it.
#   readOutside (not set here: ask): a file tool's read outside the agent home is asked for in the
#   conversation; deny refuses it. Credentials are refused either way.
#   commandNetwork (not set here: open): where the agent's commands may connect. public or local sends them
#   through the gateway's proxy and nothing else; docs/setup.md, The agent's network.
- id: deepbot
  config:
    platform: slack
    language: en
    targetChannels: ['*']
    replyMode: mention
    stateDir: !!js dshHomePath('slack-state')
    maxConcurrency: 2
    approvalPatterns: ['rm ', 'rmdir ', 'sudo ', 'dd if=', 'mkfs', 'shutdown', 'reboot', 'kill -9']
